<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mothership Character Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
      
      :root {
        /* Default Dark Mode (Zinc-based) */
        --bg-app: #09090b;       /* zinc-950 */
        --bg-panel: #18181b;     /* zinc-900 */
        --bg-panel-trans: rgba(24, 24, 27, 0.8);
        --border-color: #3f3f46; /* zinc-700 */
        --text-main: #ffffff;    /* white */
        --text-muted: #a1a1aa;   /* zinc-400 */
        --accent: #facc15;       /* yellow-400 */
        --accent-border: #facc15;
        --highlight-bg: #ffffff;
        --highlight-text: #000000;
        --input-bg: #09090b;
      }
      
      body.light-mode {
        /* Light Mode (High Contrast / Print Friendly) */
        --bg-app: #ffffff;
        --bg-panel: #f4f4f5;     /* zinc-100 */
        --bg-panel-trans: rgba(244, 244, 245, 0.9);
        --border-color: #000000; /* Black borders */
        --text-main: #000000;
        --text-muted: #52525b;   /* zinc-600 */
        --accent: #000000;       /* Black accent for stark contrast */
        --accent-border: #000000;
        --highlight-bg: #000000;
        --highlight-text: #ffffff;
        --input-bg: #ffffff;
      }
      
      body {
        font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
        background-color: var(--bg-app);
        color: var(--text-main);
        overflow-x: hidden;
        transition: background-color 0.3s, color 0.3s;
      }
      
      /* Retro Scanline Effect - Only in Dark Mode */
      
      body:not(.light-mode).crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        opacity: 0.3;
      }
      
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      
      input[readonly], textarea[readonly] { cursor: default; }
      
      /* Custom Scrollbar */
      
      ::-webkit-scrollbar {
        width: 10px;
        background: var(--bg-app);
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border: 1px solid var(--bg-app);
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }
      
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      
      .retro-border {
        border: 1px solid var(--border-color);
        box-shadow: 0 0 0 1px transparent; 
        transition: all 0.2s;
      }
      
      .app-shell { max-width: 1640px; }
      
      .workspace-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
      
      .workspace-main, .workspace-sidebar { min-width: 0; }
      
      .library-body { display: none; }
      
      .library-body.is-open { display: block; }
      
      .sidebar-heading { display: none; }
      
      .workspace-sidebar button { overflow-wrap: anywhere; }
      
      @media (min-width: 1280px) {
        .workspace-layout { grid-template-columns: 280px minmax(0, 1fr); gap: 24px; }
        .workspace-sidebar { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; scrollbar-width: thin; }
        .library-body { display: block; }
        .sidebar-heading { display: block; }
        .workspace-sidebar .sidebar-toggle { display: none; }
      }
      
      .retro-border:focus-within, .retro-border:hover {
        border-color: var(--accent);
        box-shadow: 0 0 5px rgba(var(--accent), 0.2); /* Note: simplified for var usage */
      }
    </style>
  <script type="module" crossorigin src="./assets/index-Eydpy7dG.js"></script>
</head>
  <body class="crt min-h-screen relative">
    <div id="root" class="relative z-10"></div>
</body>
</html>
