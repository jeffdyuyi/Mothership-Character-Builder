    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
      
      :root {
        --color-bg: #09090b; /* Zinc 950 */
        --color-panel: #18181b; /* Zinc 900 */
        --color-text: #e4e4e7; /* Zinc 200 */
        --color-border: #3f3f46; /* Zinc 700 */
        --color-accent: #facc15; /* Yellow 400 */
      }
      
      body {
        font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
        background-color: var(--color-bg);
        color: var(--color-text);
        overflow-x: hidden;
      }
      
      /* Retro Scanline Effect */
      
      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        opacity: 0.3;
      }
      
      /* Custom Scrollbar */
      
      ::-webkit-scrollbar {
        width: 10px;
        background: var(--color-bg);
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border: 1px solid var(--color-bg);
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent);
      }
      
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      
      .retro-border {
        border: 1px solid var(--color-border);
        box-shadow: 0 0 0 1px transparent; 
        transition: all 0.2s;
      }
      
      .retro-border:focus-within, .retro-border:hover {
        border-color: var(--color-accent);
        box-shadow: 0 0 5px rgba(250, 204, 21, 0.2);
      }
    </style>
